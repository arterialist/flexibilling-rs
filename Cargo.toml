[package]
name = "flexibilling"
version = "0.1.0"
edition = "2021"
description = "Provider-agnostic usage metering and balance billing for Rust backends."
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/arterialist/flexibilling-rs"
keywords = ["billing", "metering", "quotas", "credits"]

[dependencies]
chrono = { version = "0.4", features = ["clock", "serde"] }
rust_decimal = { version = "1.36", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
