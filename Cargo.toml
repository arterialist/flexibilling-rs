[package]
name = "flexibilling"
version = "0.1.0"
edition = "2024"
description = "Provider-agnostic usage metering and balance billing for Rust backends."
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/arterialist/flexibilling-rs"
keywords = ["billing", "metering", "quotas", "credits"]

[dependencies]
chrono = { version = "0.4.45", features = ["clock", "serde"] }
rust_decimal = { version = "1.42.1", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"

[dev-dependencies]
rusqlite = { version = "0.40.2", features = ["bundled"] }
